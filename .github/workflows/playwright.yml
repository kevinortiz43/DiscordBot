name: Playwright Tests

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 1/12 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Debug - show repo structure
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== playwright/ (if exists) ==="
          ls -la playwright/ || echo "playwright/ folder NOT FOUND"
          echo "=== .gitignore ==="
          cat .gitignore || echo "no .gitignore"

      - name: Run mod update check
        run: npx playwright test --config=playwright.config.ts --workers=1
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
